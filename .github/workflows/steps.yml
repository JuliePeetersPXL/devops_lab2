name: Steps Examples          # naam in de Actions-tab
on: 
  workflow_dispatch:            # trigger (workflow_dispatch, push, ...)

jobs:
  steps-example:
    runs-on: ubuntu-latest
    steps: 
        - name: make directory
          run: mkdir testmachine
        - name: execute uname command
          run: uname -a > testmachine/output.txt
        - name: check directory output
          run: ls -alhR testmachine             # shell-command
        - name: check contents of txt file
          run: cat testmachine/output.txt  
